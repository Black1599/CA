name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Comprobar estructura pública
        shell: bash
        run: |
          set -e
          test -f public/index.html
          test -d public/assets
          test -d public/blog
          test -d public/cat
          test -d public/cat/blog
          test -d public/css
          test -d public/js
          test -f public/robots.txt
          test -f public/sitemap.xml

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar web para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
