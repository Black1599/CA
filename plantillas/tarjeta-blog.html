<!-- ================================================================
     TARJETA DE NUEVO ARTÍCULO

     DÓNDE PEGARLA:
     Dentro de <div class="blog-post-list"> en blog/index.html.

     ORDEN:
     Pega la publicación más reciente arriba de las anteriores.

     No se utiliza imagen en el listado. Cada artículo aparece dentro de
     un cuadro blanco con categoría, fecha, título, resumen y enlace.
     ================================================================ -->
<article class="blog-card">
  <div class="blog-card-body">

    <!-- CAMBIAR: categoría y fecha. -->
    <div class="blog-card-meta">
      <span>CATEGORÍA</span>
      <time datetime="AAAA-MM-DD">FECHA VISIBLE</time>
    </div>

    <!-- CAMBIAR: título y nombre del archivo enlazado. -->
    <h3>
      <a href="NOMBRE-DEL-ARTICULO.html">TÍTULO DEL ARTÍCULO</a>
    </h3>

    <!-- CAMBIAR: resumen breve orientado a que el lector abra el artículo. -->
    <p>RESUMEN BREVE QUE INVITA A LEER EL ARTÍCULO.</p>

    <a class="blog-read-more" href="NOMBRE-DEL-ARTICULO.html">
      Leer artículo <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
